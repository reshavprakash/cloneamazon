<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Cart | CloneAmazon</title>
<link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="logo" href="index.html">clone<span>amazon</span></a><nav><a href="index.html">Home</a><a href="products.html">All Products</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="cart.html">🛒 Cart <b id="cartCount">0</b></a></nav></header><main class="wrap"><section class="panel"><h1>Your shopping cart</h1><div id="cartItems"></div><div class="total" id="total"></div><a class="btn" href="products.html">Continue shopping</a></section></main><footer><a href="index.html">Home</a> · <a href="products.html">Products</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a><br><br>CloneAmazon — student learning project</footer><script>let cart=JSON.parse(localStorage.getItem('cloneAmazonCart')||'[]');const list=document.getElementById('cartItems');function render(){document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.quantity,0);if(!cart.length){list.innerHTML='<p class="muted">Your cart is empty.</p>';document.getElementById('total').textContent='';return}list.innerHTML=cart.map((x,i)=>'<div class="cart-row"><div><strong>'+x.name+'</strong><div class="muted">₹'+x.price.toLocaleString('en-IN')+' × '+x.quantity+'</div></div><div><button onclick="change('+i+',-1)">−</button> <button onclick="change('+i+',1)">+</button> <button onclick="removeItem('+i+')">Remove</button></div></div>').join('');document.getElementById('total').textContent='Subtotal: ₹'+cart.reduce((s,x)=>s+x.price*x.quantity,0).toLocaleString('en-IN')}function save(){localStorage.setItem('cloneAmazonCart',JSON.stringify(cart));render()}function change(i,n){cart[i].quantity+=n;if(cart[i].quantity<1)cart.splice(i,1);save()}function removeItem(i){cart.splice(i,1);save()}render();</script></body></html>
