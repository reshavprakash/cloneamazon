<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | CloneAmazon</title>
<link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="logo" href="index.html">clone<span>amazon</span></a><nav><a href="index.html">Home</a><a href="products.html">All Products</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="cart.html">🛒 Cart <b id="cartCount">0</b></a></nav></header><main class="wrap"><section class="panel"><h1>Contact us</h1><p class="muted">Have feedback about this student project? Send a message using the form below.</p><form id="contactForm"><label>Your name<input class="field" id="name" required></label><label>Email address<input class="field" id="email" type="email" required></label><label>Message<textarea class="field" id="message" required></textarea></label><button class="btn" type="submit">Prepare email</button></form><p class="muted" id="note">This demo opens your email app; it does not send or store messages itself.</p></section></main><footer><a href="index.html">Home</a> · <a href="products.html">Products</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a><br><br>CloneAmazon — student learning project</footer><script>document.getElementById('cartCount').textContent=JSON.parse(localStorage.getItem('cloneAmazonCart')||'[]').reduce((s,x)=>s+x.quantity,0);document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();const subject=encodeURIComponent('CloneAmazon website feedback');const body=encodeURIComponent('Name: '+name.value+'\nEmail: '+email.value+'\n\n'+message.value);document.getElementById('note').textContent='Your email app should open with the message ready. Add a recipient address before sending.';window.location.href='mailto:?subject='+subject+'&body='+body;});</script></body></html>
