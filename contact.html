<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | CloneAmazon</title>
<style>
:root{--navy:#131921;--navy2:#232f3e;--yellow:#ffd814;--bg:#e3e6e6}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}a{text-decoration:none;color:inherit}.top{background:var(--navy);color:white;padding:17px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.logo{font-size:26px;font-weight:bold}.logo span{color:#febd69}.top nav{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}.top nav a:hover{text-decoration:underline}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.panel{background:white;padding:24px;margin-bottom:18px}.panel h1{margin-top:0}.muted{color:#565959;line-height:1.6}.btn{display:inline-block;background:var(--yellow);border:1px solid #f0c400;border-radius:20px;padding:10px 18px;cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.item{background:white;padding:14px;display:flex;flex-direction:column}.item img{width:100%;height:160px;object-fit:contain}.item h3{font-size:15px;min-height:40px}.price{font-weight:bold;font-size:19px;margin:8px 0}.item button{margin-top:auto}.cart-row{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #ddd;padding:15px 0}.cart-row button{background:#eee;border:1px solid #bbb;border-radius:5px;padding:6px 10px;cursor:pointer}.total{font-size:21px;font-weight:bold;text-align:right;margin:20px 0}.field{display:block;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #aaa;border-radius:4px}textarea.field{min-height:130px}footer{background:var(--navy2);color:white;text-align:center;padding:25px;margin-top:35px;font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.item{padding:9px}.item img{height:120px}.top{align-items:flex-start}.cart-row{align-items:flex-start;flex-wrap:wrap}}
</style></head><body><header class="top"><a class="logo" href="index.html">clone<span>amazon</span></a><nav><a href="index.html">Home</a><a href="products.html">All Products</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="cart.html">🛒 Cart <b id="cartCount">0</b></a></nav></header><main class="wrap"><section class="panel"><h1>Contact us</h1><p class="muted">Have feedback about this student project? Send a message using the form below.</p><form id="contactForm"><label>Your name<input class="field" id="name" required></label><label>Email address<input class="field" id="email" type="email" required></label><label>Message<textarea class="field" id="message" required></textarea></label><button class="btn" type="submit">Prepare email</button></form><p class="muted" id="note">This demo opens your email app; it does not send or store messages itself.</p></section></main><footer><a href="index.html">Home</a> · <a href="products.html">Products</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a><br><br>CloneAmazon — student learning project</footer><script>document.getElementById('cartCount').textContent=JSON.parse(localStorage.getItem('cloneAmazonCart')||'[]').reduce((s,x)=>s+x.quantity,0);document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();const subject=encodeURIComponent('CloneAmazon website feedback');const body=encodeURIComponent('Name: '+name.value+'\nEmail: '+email.value+'\n\n'+message.value);document.getElementById('note').textContent='Your email app should open with the message ready. Add a recipient address before sending.';window.location.href='mailto:?subject='+subject+'&body='+body;});</script></body></html>
